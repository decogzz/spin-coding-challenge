services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spin
      POSTGRES_PASSWORD: spin
      POSTGRES_DB: transactions
    ports:
      - "5432:5432"
    volumes:
      # Scripts here run only when the database is first created.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spin -d transactions"]
      interval: 2s
      timeout: 3s
      retries: 15

  providermock:
    build:
      context: .
      args:
        CMD: providermock
    environment:
      PROVIDER_MOCK_ADDR: ":8081"
      PROVIDER_MOCK_INITIAL_BALANCE: "10000.00"
      PROVIDER_MOCK_SLOW_DELAY: "5s"
    ports:
      - "8081:8081"

  api:
    build:
      context: .
      args:
        CMD: api
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://spin:spin@postgres:5432/transactions?sslmode=disable&pool_max_conns=20"
      PROVIDER_BASE_URL: "http://providermock:8081"
      PROVIDER_ATTEMPT_TIMEOUT: "2s"
      PROVIDER_MAX_ATTEMPTS: "3"
      PROVIDER_BREAKER_FAILURES: "5"
      PROVIDER_BREAKER_OPEN_TIMEOUT: "30s"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      providermock:
        condition: service_started
