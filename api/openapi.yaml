openapi: 3.1.0
info:
  title: Spin Transaction Execution API
  version: 1.0.0
  description: |
    Executes CREDIT and DEBIT transactions against an external provider, persists
    the outcome and exposes it for querying. Amounts are JSON numbers with at most
    two decimal places; only MXN is supported.
servers:
  - url: http://localhost:8080
paths:
  /transactions:
    post:
      summary: Execute a transaction
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
            example:
              accountId: acc-123456
              type: CREDIT
              amount: 1500.00
              currency: MXN
              description: Transferencia recibida
      responses:
        "201":
          description: The provider executed the transaction.
          headers:
            Location:
              schema:
                type: string
              description: URL of the created transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
              example:
                id: 01a0df06-5d40-7dbc-84e4-41d1089296fb
                accountId: acc-123456
                type: CREDIT
                amount: 1500.00
                currency: MXN
                description: Transferencia recibida
                status: EXECUTED
                providerTransactionId: txn-789
                balanceAfter: 5500.00
                createdAt: "2025-03-15T10:30:00Z"
                updatedAt: "2025-03-15T10:30:00Z"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          description: The provider rejected the transaction (for example insufficient funds). It is persisted with status REJECTED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
              example:
                id: 01a0df06-5d6d-75e3-9aa5-4f1727abd26e
                accountId: acc-insufficient
                type: DEBIT
                amount: 50.00
                currency: MXN
                description: ""
                status: REJECTED
                failureCode: INSUFFICIENT_FUNDS
                failureMessage: The account does not have enough balance to complete the transaction
                createdAt: "2025-03-15T10:30:00Z"
                updatedAt: "2025-03-15T10:30:00Z"
        "502":
          description: |
            The provider could not be reached or kept failing after retries, or the
            circuit breaker is open. The transaction is persisted with status FAILED;
            its real outcome at the provider is unconfirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "500":
          $ref: "#/components/responses/Error"
    get:
      summary: List transactions, newest first
      operationId: listTransactions
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/Type"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/Error"
  /transactions/{id}:
    get:
      summary: Get one transaction
      operationId: getTransaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/Error"
  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: The process is running.
  /readyz:
    get:
      summary: Readiness probe (checks the database)
      operationId: readyz
      responses:
        "200":
          description: Ready to serve traffic.
        "503":
          $ref: "#/components/responses/Error"
components:
  schemas:
    Type:
      type: string
      enum: [CREDIT, DEBIT]
    Status:
      type: string
      enum: [PENDING, EXECUTED, REJECTED, FAILED]
      description: |
        PENDING is recorded before calling the provider. EXECUTED means the provider
        approved it; REJECTED means the provider refused it for a business reason;
        FAILED means the provider could not confirm the outcome.
    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required: [accountId, type, amount, currency]
      properties:
        accountId:
          type: string
          maxLength: 64
        type:
          $ref: "#/components/schemas/Type"
        amount:
          type: number
          description: Must be greater than 1.00. DEBIT amounts must not exceed 10000.00. At most two decimals.
          exclusiveMinimum: 1
        currency:
          type: string
          enum: [MXN]
        description:
          type: string
          maxLength: 255
    Transaction:
      type: object
      required: [id, accountId, type, amount, currency, description, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
        type:
          $ref: "#/components/schemas/Type"
        amount:
          type: number
        currency:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        providerTransactionId:
          type: string
          description: Present when EXECUTED.
        balanceAfter:
          type: number
          description: Account balance reported by the provider; present when EXECUTED.
        failureCode:
          type: string
          description: Present when REJECTED or FAILED.
        failureMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TransactionPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        pagination:
          type: object
          required: [page, limit, hasMore]
          properties:
            page:
              type: integer
            limit:
              type: integer
            hasMore:
              type: boolean
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [VALIDATION_FAILED, INVALID_REQUEST_BODY, PAYLOAD_TOO_LARGE, NOT_FOUND, NOT_READY, INTERNAL_ERROR]
        message:
          type: string
        details:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
              code:
                type: string
                examples: [REQUIRED, AMOUNT_TOO_LOW, DEBIT_LIMIT_EXCEEDED, UNSUPPORTED_CURRENCY, UNSUPPORTED_TYPE]
              message:
                type: string
  responses:
    ValidationFailed:
      description: The request broke one or more validation or business rules. Nothing was executed or persisted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: VALIDATION_FAILED
            message: the request is invalid; see details
            details:
              - field: amount
                code: DEBIT_LIMIT_EXCEEDED
                message: DEBIT amount must not exceed 10000.00 per transaction
              - field: currency
                code: UNSUPPORTED_CURRENCY
                message: currency must be MXN
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
