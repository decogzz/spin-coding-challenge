[project]
name = "spin-transactions"
version = "1.0.0"
description = "Transaction execution API for the Spin backend challenge"
authors = [
    { name = "Deco", email = "decogzz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "simplejson>=4.1.2",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
spin-api = "spin_transactions.main:run"
spin-provider-mock = "spin_transactions.providermock.main:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-simplejson>=4.1.0.20260724",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "S", "PT", "RET", "PL", "TRY", "N", "DTZ",
]
ignore = [
    "PLR2004", # magic numbers in tests and HTTP status comparisons read fine
    "TRY003",  # descriptive messages on domain exceptions are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "S311"]
"migrations/**" = ["N999"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a PostgreSQL database (TEST_DATABASE_URL)"]
addopts = "-m 'not integration' --strict-markers"

[tool.coverage.run]
source = ["spin_transactions"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
